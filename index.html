<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clima dei locali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Sora:wght@300;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#e8edf1;--bg2:#dde5eb;--card:#fbfcfd;--ink:#0d1b26;--mute:#566877;--line:#d3dce4;
  --t:#c8472a;--h:#1d6fb8;--p:#2b8a68;
  --c1:#0f9d8a;--c2:#3b6cf0;--c3:#a948c9;--c4:#e8801c;
  --shadow:0 1px 2px rgba(13,27,38,.06),0 8px 24px -12px rgba(13,27,38,.18);
  --ok:#2b9d63;--warn:#d98a10;--off:#8a97a3;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0a121a;--bg2:#0e1822;--card:#111d28;--ink:#e9f0f5;--mute:#8da0b0;--line:#223241;
  --t:#ff8a68;--h:#6db4f2;--p:#58d3a5;
  --c1:#2fd1b9;--c2:#6f95ff;--c3:#cf7ff0;--c4:#ffa04d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --ok:#47d58a;--warn:#f2b034;--off:#6c7c8a;
}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 500px at 85% -10%,var(--bg2),transparent 70%),var(--bg);
  color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
main{max-width:1180px;margin:0 auto;padding:32px 18px 56px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:26px}
h1{font:700 clamp(1.8rem,4.5vw,2.8rem)/1.05 Sora,Manrope,sans-serif;margin:0;letter-spacing:-.03em}
.sub{color:var(--mute);font-size:.95rem;margin-top:6px}
.live{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.88rem;font-weight:600;box-shadow:var(--shadow)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2.4s infinite}
.live.err i{background:var(--t);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:16px}
.room{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 20px 16px;box-shadow:var(--shadow);overflow:hidden;
  background-image:linear-gradient(180deg,color-mix(in srgb,var(--c) 11%,transparent),transparent 120px)}
.room::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.room h2{margin:0;font:600 1.12rem Sora,Manrope,sans-serif;letter-spacing:-.01em}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;color:var(--mute)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.badge.stale i{background:var(--warn)}.badge.none i{background:var(--off)}
.badge.stale{color:var(--warn)}
.when{color:var(--mute);font-size:.8rem;margin:2px 0 8px}
.big{font:300 3.4rem/1 Sora,Manrope,sans-serif;letter-spacing:-.05em;color:var(--ink);white-space:nowrap}
.big small{font:600 1.15rem Sora,sans-serif;color:var(--c);letter-spacing:0;margin-left:3px}
.delta{font-size:.82rem;font-weight:600;margin:4px 0 6px;min-height:1.2em}
.delta.up{color:var(--t)}.delta.down{color:var(--h)}.delta.flat{color:var(--mute)}
.spark{display:block;width:100%;height:46px;margin:2px 0 12px}
.meters{display:grid;gap:10px;margin-bottom:12px}
.m{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline;font-size:.85rem}
.m span{color:var(--mute)}.m b{font-weight:800}
.track{grid-column:1/-1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.track div{height:100%;border-radius:99px;transition:width .6s ease}
.rng{font-size:.78rem;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
.rng b{color:var(--ink);font-weight:600}
.skel{height:268px;border-radius:18px;background:linear-gradient(90deg,var(--card),var(--bg2),var(--card));background-size:200% 100%;animation:sh 1.4s infinite;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}

.chartbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:20px;box-shadow:var(--shadow)}
.ctitle{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.ctitle h3{margin:0;font:600 1.25rem Sora,Manrope,sans-serif;letter-spacing:-.02em}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
button,select{font:inherit;font-size:.88rem;font-weight:600;color:var(--ink);background:transparent;border:0;border-radius:999px;padding:7px 15px;cursor:pointer;transition:background .15s,color .15s}
select{background:var(--bg);border:1px solid var(--line);padding:8px 14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--card)}
.seg button:not([aria-pressed=true]):hover{background:var(--line)}
button:focus-visible,select:focus-visible{outline:2px solid var(--h);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--c);color:var(--ink);padding:6px 14px 6px 10px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=false]{border-color:var(--line);color:var(--mute);text-decoration:line-through}
.chip[aria-pressed=false] i{background:var(--line)}
.canvas{position:relative;height:380px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:18px}
.st{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:10px 14px;background:var(--bg)}
.st h4{margin:0 0 6px;font:600 .9rem Sora,Manrope,sans-serif}
.st div{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mute)}
.st b{color:var(--ink);font-weight:800}
#err{color:var(--t);margin-top:16px;font-size:.9rem;white-space:pre-line}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:560px){.big{font-size:3rem}.canvas{height:300px}main{padding-top:22px}}
</style>
</head>
<body>
<main>
<header>
  <div><h1>Clima dei locali</h1><div class="sub">Temperatura, umidità e pressione in tempo reale</div></div>
  <div class="live" id="live"><i></i><span id="status">Caricamento…</span></div>
</header>
<section class="grid" id="rooms" aria-label="Ultime misure"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></section>
<section class="chartbox">
  <div class="ctitle">
    <h3 id="ctitle">Andamento</h3>
    <div class="bar">
      <div class="seg" id="metrics" role="group" aria-label="Grandezza"></div>
      <select id="range" aria-label="Quante misure mostrare">
        <option value="50">Ultime 50 misure</option>
        <option value="200" selected>Ultime 200 misure</option>
        <option value="500">Ultime 500 misure</option>
        <option value="1000">Ultime 1000 misure</option>
      </select>
    </div>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Locali nel grafico"></div>
  <div class="canvas"><canvas id="chart" role="img" aria-label="Storico delle misure"></canvas></div>
  <div class="stats" id="stats"></div>
</section>
<div id="err"></div>
</main>

<script>
/* ====== CONFIGURAZIONE: modifica solo questa parte ====== */
const DB_URL  = "https://IL-TUO-PROGETTO-default-rtdb.europe-west1.firebasedatabase.app"; // URL del Realtime Database
const ROOMS   = [ // id = nome del nodo su Firebase, name = nome mostrato
  {id:"locale1", name:"Ingresso"},
  {id:"locale2", name:"1°piano"},
  {id:"locale3", name:"2°piano"},
  {id:"locale4", name:"Esterno"},
];
const BASE_PATH = "sensori";           // percorso padre: /sensori/locale1, /sensori/locale2…
const FIELDS = {t:"temperature", h:"humidity", p:"pressure", ts:"timestamp"}; // nomi dei campi nei dati
const REFRESH_MS = 30000;              // aggiornamento automatico
const STALE_MIN  = 15;                 // dopo quanti minuti senza dati segnalare "non aggiornato"
/* ======================================================== */

const METRICS = {
  t:{label:"Temperatura", unit:"°C",  dec:1, min:null, max:null},
  h:{label:"Umidità",     unit:"%",   dec:0, min:0,    max:100},
  p:{label:"Pressione",   unit:"hPa", dec:0, min:960,  max:1060},
};
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let metric = "t", data = {}, chart, hidden = new Set();

function toMs(v){ v = Number(v); return v < 1e11 ? v*1000 : v; }
function num(v){ v = parseFloat(v); return Number.isFinite(v) ? v : null; }
function parse(raw){
  if(!raw) return [];
  const recs = raw[FIELDS.t] !== undefined ? [raw] : Object.keys(raw).sort().map(k => raw[k]);
  return recs.filter(r => r && typeof r === "object").map((r,i) => ({
    x: r[FIELDS.ts] != null ? toMs(r[FIELDS.ts]) : i,
    t: num(r[FIELDS.t]), h: num(r[FIELDS.h]), p: num(r[FIELDS.p]),
  })).sort((a,b) => a.x - b.x);
}
const fmtDate = ms => new Date(ms).toLocaleString("it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const fmtN = (v,d) => v == null ? "–" : v.toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d});

async function load(){
  const n = document.getElementById("range").value, errs = [];
  await Promise.all(ROOMS.map(async r => {
    try{
      const url = `${DB_URL}/${BASE_PATH}/${r.id}.json?orderBy=%22$key%22&limitToLast=${n}`;
      const res = await fetch(url);
      if(!res.ok) throw new Error(`HTTP ${res.status}` + (res.status===401 ? " (regole di lettura non pubbliche)" : ""));
      data[r.id] = parse(await res.json());
    }catch(e){ errs.push(`${r.name}: ${e.message}`); data[r.id] = data[r.id] || []; }
  }));
  document.getElementById("err").textContent = errs.length ? "Errore di lettura da Firebase:\n" + errs.join("\n") : "";
  document.getElementById("live").classList.toggle("err", errs.length === ROOMS.length);
  document.getElementById("status").textContent = (errs.length === ROOMS.length ? "Connessione assente, ultimo tentativo " : "Aggiornato alle ") + new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  drawRooms(); drawChart();
}

function spark(d, k, col){
  const v = d.map(p => p[k]).filter(x => x != null).slice(-60);
  if(v.length < 2) return `<svg class="spark" aria-hidden="true"></svg>`;
  const lo = Math.min(...v), hi = Math.max(...v), span = (hi-lo) || 1, W = 200, H = 46, pad = 4;
  const pts = v.map((y,i) => [i/(v.length-1)*W, H-pad-((y-lo)/span)*(H-pad*2)]);
  const line = pts.map((p,i) => (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${line} L${W} ${H} L0 ${H}Z" fill="${col}" opacity=".13"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.2" fill="${col}" vector-effect="non-scaling-stroke"/></svg>`;
}

function drawRooms(){
  document.getElementById("rooms").innerHTML = ROOMS.map((r,i) => {
    const d = data[r.id] || [], last = d[d.length-1], col = cssv(`--c${i+1}`);
    const hasTime = last && last.x > 1e11;
    const stale = hasTime && (Date.now()-last.x) > STALE_MIN*60000;
    const state = !last ? ["none","Nessun dato"] : stale ? ["stale","Non aggiornato"] : ["","In linea"];
    const when = hasTime ? "Ultima misura: " + fmtDate(last.x) : "";
    const ts = d.map(p => p.t).filter(x => x != null);
    // variazione della temperatura rispetto a ~1 ora prima (o alla prima misura disponibile)
    let delta = "";
    if(last && last.t != null && ts.length > 1){
      let ref = d.find(p => p.t != null);
      if(hasTime){ const target = last.x - 3600000; ref = [...d].reverse().find(p => p.t != null && p.x <= target) || ref; }
      const df = last.t - ref.t, cls = Math.abs(df) < .15 ? "flat" : df > 0 ? "up" : "down";
      delta = `<div class="delta ${cls}">${cls==="flat"?"Stabile":(df>0?"▲ +":"▼ ")+fmtN(df,1)+" °C"}${hasTime?" nell'ultima ora":" dalla prima misura"}</div>`;
    }
    const meter = k => {
      const m = METRICS[k], v = last ? last[k] : null;
      const pc = v == null ? 0 : Math.max(0, Math.min(100, (v-m.min)/(m.max-m.min)*100));
      return `<div class="m"><span>${m.label}</span><b>${fmtN(v,m.dec)}${v!=null?" "+m.unit:""}</b><div class="track"><div style="width:${pc}%;background:var(--${k})"></div></div></div>`;
    };
    const rng = ts.length ? `Min <b>${fmtN(Math.min(...ts),1)}°</b> &nbsp; Max <b>${fmtN(Math.max(...ts),1)}°</b> &nbsp; su ${ts.length} misure` : "Nessuna misura nel periodo";
    return `<article class="room" style="--c:${col}">
      <div class="rh"><h2>${r.name}</h2><span class="badge ${state[0]}"><i></i>${state[1]}</span></div>
      <div class="when">${when || "&nbsp;"}</div>
      <div class="big">${fmtN(last?last.t:null,1)}<small>${last&&last.t!=null?"°C":""}</small></div>
      ${delta || '<div class="delta">&nbsp;</div>'}
      ${spark(d,"t",col)}
      <div class="meters">${meter("h")}${meter("p")}</div>
      <div class="rng">${rng}</div></article>`;
  }).join("");
}

function drawChips(){
  document.getElementById("chips").innerHTML = ROOMS.map((r,i) =>
    `<button class="chip" data-id="${r.id}" style="--c:${cssv("--c"+(i+1))}" aria-pressed="${!hidden.has(r.id)}"><i></i>${r.name}</button>`).join("");
}

function drawStats(){
  const m = METRICS[metric];
  document.getElementById("stats").innerHTML = ROOMS.map((r,i) => {
    if(hidden.has(r.id)) return "";
    const v = (data[r.id]||[]).map(p => p[metric]).filter(x => x != null);
    if(!v.length) return "";
    const avg = v.reduce((a,b)=>a+b,0)/v.length;
    return `<div class="st" style="--c:${cssv("--c"+(i+1))}"><h4>${r.name}</h4>
      <div>Minima <b>${fmtN(Math.min(...v),m.dec)} ${m.unit}</b></div>
      <div>Media <b>${fmtN(avg,m.dec)} ${m.unit}</b></div>
      <div>Massima <b>${fmtN(Math.max(...v),m.dec)} ${m.unit}</b></div></div>`;
  }).join("");
}

function drawChart(){
  const m = METRICS[metric], ink = cssv("--mute"), grid = cssv("--line"), tipbg = cssv("--ink"), tiptx = cssv("--card");
  document.getElementById("ctitle").textContent = "Andamento · " + m.label.toLowerCase();
  drawChips(); drawStats();
  const datasets = ROOMS.map((r,i) => {
    const col = cssv(`--c${i+1}`);
    return {
      label:r.name, borderColor:col, borderWidth:2.5, pointRadius:0, pointHoverRadius:6, pointHoverBackgroundColor:col,
      pointHoverBorderColor:cssv("--card"), pointHoverBorderWidth:2, tension:.35, spanGaps:true, fill:true, hidden:hidden.has(r.id),
      backgroundColor:ctx => {
        const a = ctx.chart.chartArea; if(!a) return col + "22";
        const g = ctx.chart.ctx.createLinearGradient(0,a.top,0,a.bottom);
        g.addColorStop(0,col+"38"); g.addColorStop(1,col+"00"); return g;
      },
      data:(data[r.id]||[]).filter(p => p[metric] != null).map(p => ({x:p.x, y:p[metric]})),
    };
  });
  const cfg = {type:"line", data:{datasets}, options:{
    responsive:true, maintainAspectRatio:false, animation:false, parsing:false,
    interaction:{mode:"nearest", axis:"x", intersect:false},
    plugins:{legend:{display:false},
      tooltip:{backgroundColor:tipbg, titleColor:tiptx, bodyColor:tiptx, padding:12, cornerRadius:10, boxPadding:5, usePointStyle:true,
        titleFont:{family:"Manrope",weight:"800"}, bodyFont:{family:"Manrope",weight:"600"},
        callbacks:{title:i => i[0].parsed.x > 1e11 ? fmtDate(i[0].parsed.x) : "Misura " + i[0].parsed.x,
                   label:c => ` ${c.dataset.label}: ${fmtN(c.parsed.y,m.dec+1)} ${m.unit}`}}},
    scales:{
      x:{type:"linear", grid:{display:false}, border:{display:false}, ticks:{color:ink, maxTicksLimit:7, font:{family:"Manrope"}, callback:v => v > 1e11 ? fmtDate(v) : v}},
      y:{grid:{color:grid}, border:{display:false}, ticks:{color:ink, font:{family:"Manrope"}, padding:8, callback:v => fmtN(v, m.dec)},
         title:{display:true, text:`${m.label} (${m.unit})`, color:ink, font:{family:"Manrope",weight:"600"}}},
    }}};
  if(chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), cfg);
}

document.getElementById("metrics").innerHTML = Object.keys(METRICS).map(k =>
  `<button data-k="${k}" aria-pressed="${k===metric}">${METRICS[k].label}</button>`).join("");
document.getElementById("metrics").addEventListener("click", e => {
  const k = e.target.dataset.k; if(!k) return;
  metric = k;
  document.querySelectorAll("#metrics button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k));
  drawChart();
});
document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  hidden.has(b.dataset.id) ? hidden.delete(b.dataset.id) : hidden.add(b.dataset.id);
  drawChart();
});
document.getElementById("range").addEventListener("change", load);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { drawRooms(); drawChart(); });
load(); setInterval(load, REFRESH_MS);
</script>
</body>
</html>
